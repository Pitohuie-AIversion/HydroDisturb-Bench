[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrodisturb-bench"
version = "0.1.0"
description = "Case planning and optional COMSOL automation for hidden-disturbance underwater cylinder wakes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "HydroDisturb-Bench contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "numpy>=2.0",
    "scipy>=1.10",
    "ruff>=0.8",
]
analysis = ["matplotlib>=3.7", "numpy>=2.0", "scipy>=1.10"]
comsol = ["MPh>=1.2"]

[project.scripts]
hydrobench = "hydro_disturb_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring real COMSOL installation (deselect with '-m \"not integration\"')",
    "artifact: validates historical local models/results; missing artifacts fail when selected (CI excludes this marker)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".agents",
    ".git",
    ".venv",
    "runs",
    "build",
    "dist",
    "docs/evidence",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "F841",  # local variable assigned but never used (common in fixtures/plots)
    "E402",  # module level import not at top of file (scripts modify sys.path)
]
