name: Python scaffold & offline checks
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Code style & static lint check (Ruff)
        run: uv run --extra dev ruff check .

      - name: Offline unit & contract tests (NO COMSOL required)
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q -m "not integration"

      - name: Repository scaffold static check
        run: uv run --python ${{ matrix.python-version }} python scripts/check_repo.py
