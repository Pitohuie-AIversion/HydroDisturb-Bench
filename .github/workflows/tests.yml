name: Python scaffold checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'
      - name: Unit tests (NO COMSOL execution)
        run: python -m pytest -q
      - name: Scaffold check
        run: python scripts/check_repo.py
