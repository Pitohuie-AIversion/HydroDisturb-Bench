name: Python offline checks
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked development and analysis dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra analysis

      - name: Code style & static lint check (Ruff)
        run: uv run --no-sync --python ${{ matrix.python-version }} ruff check .

      - name: Offline unit and contract tests (no COMSOL or local results)
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -q --strict-markers -m "not integration and not artifact" --junitxml=test-results/offline.xml

      - name: Upload offline test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-tests-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/offline.xml
          if-no-files-found: warn

      - name: Repository entry point and documentation check
        run: uv run --no-sync --python ${{ matrix.python-version }} python scripts/check_repo.py
